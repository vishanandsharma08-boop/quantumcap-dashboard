<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuantumCap - Advanced Financial Analytics Dashboard for Cryptocurrency Markets">
    <meta name="theme-color" content="#0f172a">
    
    <title>QuantumCap Dashboard | Financial Analytics</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        * {
            @apply transition-colors duration-150;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            @apply text-slate-100;
        }
        
        .glass {
            @apply bg-slate-900/40 backdrop-blur-sm border border-slate-700/20;
        }
        
        .shimmer {
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .metric-card {
            @apply glass p-6 rounded-lg;
        }
        
        .metric-card:hover {
            @apply bg-slate-900/60 border-slate-600/40;
        }
        
        table {
            @apply w-full;
        }
        
        tbody tr {
            @apply border-b border-slate-700/20 last:border-0;
        }
        
        tbody tr:hover {
            @apply bg-slate-800/30;
        }
        
        input, button {
            @apply outline-none;
        }
        
        button:disabled {
            @apply opacity-50 cursor-not-allowed;
        }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <!-- Header Section -->
        <header class="sticky top-0 z-50 glass border-b border-slate-700/20 backdrop-blur-xl">
            <div class="container mx-auto px-4 py-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h1 class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                            QuantumCap
                        </h1>
                        <p class="text-slate-400 text-sm mt-1">Financial Analytics Dashboard</p>
                    </div>
                    
                    <div class="flex gap-3">
                        <div id="connection-status" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                            <span>Initializing...</span>
                        </div>
                        
                        <button 
                            id="refresh-btn"
                            aria-label="Refresh market data"
                            class="inline-flex items-center gap-2 px-4 py-1.5 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-sm transition-all hover:shadow-lg hover:shadow-indigo-500/20 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <i id="refresh-icon" data-lucide="refresh-cw" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">Refresh</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Error Banner -->
            <div id="error-container" class="hidden mb-6 p-4 bg-rose-900/20 border border-rose-500/30 rounded-lg backdrop-blur-sm" role="alert">
                <div class="flex items-start gap-3">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-rose-400 flex-shrink-0 mt-0.5"></i>
                    <p id="error-message" class="text-rose-300 text-sm"></p>
                </div>
            </div>

            <!-- Metrics Grid -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <!-- Total Market Cap -->
                <div class="metric-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm font-medium mb-2">Total Market Cap</p>
                            <p id="total-market-cap" class="text-2xl sm:text-3xl font-bold text-slate-100">$0</p>
                        </div>
                        <div class="p-3 bg-indigo-500/20 rounded-lg">
                            <i data-lucide="trending-up" class="w-6 h-6 text-indigo-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Top Gainer -->
                <div class="metric-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm font-medium mb-2">Top Gainer (24h)</p>
                            <p id="top-gainer" class="text-xl sm:text-2xl font-bold text-slate-100 mb-1">--</p>
                            <p id="top-gainer-val" class="text-sm text-emerald-400 font-semibold">--</p>
                        </div>
                        <div class="p-3 bg-emerald-500/20 rounded-lg">
                            <i data-lucide="arrow-up" class="w-6 h-6 text-emerald-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Data Status -->
                <div class="metric-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-slate-400 text-sm font-medium mb-2">Data Status</p>
                            <p class="text-sm text-slate-200">
                                <span id="asset-count" class="font-bold text-indigo-400">0</span>
                                <span class="text-slate-400">assets loaded</span>
                            </p>
                            <p id="last-updated" class="text-xs text-slate-500 mt-1">Never updated</p>
                        </div>
                        <div class="p-3 bg-purple-500/20 rounded-lg">
                            <i data-lucide="database" class="w-6 h-6 text-purple-400"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Search Section -->
            <section class="mb-6">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 pointer-events-none"></i>
                    <input 
                        id="search-input"
                        type="text"
                        placeholder="Search by name or symbol (e.g., Bitcoin, BTC)..."
                        class="w-full glass pl-11 pr-4 py-3 rounded-lg border border-slate-700/30 focus:border-indigo-500/50 focus:bg-slate-900/60 text-slate-100 placeholder-slate-500"
                        aria-label="Search cryptocurrencies"
                    />
                </div>
            </section>

            <!-- Table Section -->
            <section class="glass rounded-lg border border-slate-700/20 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-slate-700/20 bg-slate-800/30">
                                <th class="py-4 px-4 sm:px-6 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Asset</th>
                                <th class="py-4 px-4 sm:px-6 text-right text-xs font-semibold text-slate-300 uppercase tracking-wider">Price</th>
                                <th class="py-4 px-4 sm:px-6 text-right text-xs font-semibold text-slate-300 uppercase tracking-wider">24h Change</th>
                                <th class="py-4 px-4 sm:px-6 text-right text-xs font-semibold text-slate-300 uppercase tracking-wider hidden md:table-cell">Market Cap</th>
                                <th class="py-4 px-4 sm:px-6 text-right text-xs font-semibold text-slate-300 uppercase tracking-wider hidden sm:table-cell">Volume</th>
                            </tr>
                        </thead>
                        <tbody id="asset-table-body">
                            <!-- Loading skeleton rows -->
                            <tr class="border-b border-slate-700/20"><td colspan="5" class="py-4 px-6 text-center text-slate-500">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Load More Button -->
            <button 
                id="load-more-btn"
                class="w-full mt-6 px-4 py-3 bg-gradient-to-r from-slate-800 to-slate-700 hover:from-slate-700 hover:to-slate-600 text-slate-200 font-semibold rounded-lg border border-slate-600/30 transition-all hover:border-slate-500/50 disabled:opacity-50 flex items-center justify-center gap-2"
                style="display: none;"
                aria-label="Load more cryptocurrencies"
            >
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                <span>Load More Assets</span>
            </button>

            <!-- Footer -->
            <footer class="mt-12 pt-8 border-t border-slate-700/20 text-center text-slate-400 text-sm">
                <p class="mb-2">
                    <span>Data provided by</span>
                    <a href="https://www.coingecko.com/" target="_blank" rel="noopener noreferrer" class="text-indigo-400 hover:text-indigo-300 font-semibold">CoinGecko</a>
                </p>
                <p class="text-xs text-slate-500">
                    QuantumCap Dashboard v2.0.0 • 
                    <span id="update-time">Last updated: Never</span>
                </p>
            </footer>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app-improved.js"></script>
</body>
</html>
